name: XeLaTeX compile
on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compile research demonstration
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
      - name: Compile vehicle motion equations presentation
        uses: xu-cheng/latex-action@v3
        with:
          root_file: vehicle-motion-equations.tex
          latexmk_use_xelatex: true
      - name: Compile legacy-interface smoke test
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tests/layout-smoke.tex
          work_in_root_file_dir: false
          latexmk_use_xelatex: true
      - name: Compile from a different project directory
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: tests/portable
          latexmk_use_xelatex: true
        env:
          TEXINPUTS: "../../:"
      - name: Upload rendered PDF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beamer-layout-preview
          path: |
            main.pdf
            main.log
            vehicle-motion-equations.pdf
            vehicle-motion-equations.log
            layout-smoke.pdf
            tests/layout-smoke.pdf
            tests/layout-smoke.log
            tests/portable/main.pdf
            tests/portable/main.log
